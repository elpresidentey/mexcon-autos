<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline - Mexcon Autos</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#16a34a" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0a0f1c;
        color: #f8fafc;
        padding: 24px;
      }
      .card {
        text-align: center;
        max-width: 420px;
      }
      .icon {
        width: 72px;
        height: 72px;
        margin: 0 auto 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(250, 204, 21, 0.1);
        border: 1px solid rgba(250, 204, 21, 0.3);
        border-radius: 50%;
        padding: 14px;
      }
      .icon svg {
        width: 100%;
        height: 100%;
      }
      h1 {
        font-size: 28px;
        font-weight: 800;
        letter-spacing: -0.02em;
        margin-bottom: 8px;
      }
      p {
        color: #94a3b8;
        line-height: 1.6;
        margin-bottom: 24px;
      }
      .actions {
        display: flex;
        gap: 12px;
        justify-content: center;
      }
      a, button {
        font: inherit;
        font-weight: 600;
        font-size: 14px;
        padding: 12px 20px;
        border-radius: 10px;
        border: none;
        cursor: pointer;
        text-decoration: none;
        transition: opacity 0.2s;
      }
      a:hover, button:hover { opacity: 0.85; }
      .primary { background: #eab308; color: #0a0f0c; }
      .ghost { background: transparent; color: #e2e8f0; border: 1px solid #334155; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon" style="background: white; border: 2px solid #eab308; padding: 8px; border-radius: 12px;"><img src="/Logo 1.png" alt="Mexcon Autos" style="width: 100%; height: 100%; object-fit: contain;" /></div>
      <h1>You're offline</h1>
      <p>You don't appear to have an internet connection right now. Reconnect and try again, or check your previously visited pages.</p>
      <div class="actions">
        <button class="primary" onclick="location.reload()">Retry Connection</button>
        <a class="ghost" href="/">Back to Home</a>
      </div>
    </div>
  </body>
</html>
